version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/samcharles93/archipelago/sdk
plugins:
  - local: protoc-gen-go
    out: sdk
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: sdk
    opt: paths=source_relative
