apiVersion: dev.archie.package.v1
displayName: Email channel
description: "Email chat channel: polls a mailbox over IMAP, routes mail from allowed, DMARC/DKIM-authenticated senders, replies over SMTP. The mail hosts are named by the operator's egress acceptance."
version: 1.0.0
contributes:
  extensions:
    - surface: channel
      path: bin/email
files:
  - path: bin/email
    mode: 493
